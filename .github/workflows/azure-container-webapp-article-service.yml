name: Build and deploy the article service
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  article:
    uses: ./.github/workflows/deploy-stage.yml
    with:
      service: article-service
      context: article-service
      app: thomasriley-article-w3-pilot
