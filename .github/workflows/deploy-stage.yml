name: Build and deploy stage digest
on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        required: true
        type: string
      app:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: publish
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/tomdriley/thomasriley-ca:${{ inputs.service }}-${{ github.sha }}
          context: ./${{ inputs.context }}
          file: ./${{ inputs.context }}/Dockerfile
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: stage-${{ inputs.service }}
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: b9ee5d35-c096-4772-8a56-0529054b4dcf
      - name: Deploy and verify digest
        env:
          APP: ${{ inputs.app }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: bash scripts/deploy-image.sh "$APP" stage "$DIGEST"
