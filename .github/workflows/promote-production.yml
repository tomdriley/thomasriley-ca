name: Promote verified stage digest to production
on:
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options: [website, article-service]
        required: true
      digest:
        description: Exact sha256 digest currently verified on stage
        type: string
        required: true
      stage_run_id:
        description: Successful component stage workflow run containing its immutable verification artifact
        type: string
        required: true
      confirmation:
        description: Type PROMOTE to update the selected pilot production app
        type: string
        required: true
permissions:
  contents: read
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PROMOTE'
    runs-on: ubuntu-latest
    environment: production-${{ inputs.service }}
    concurrency:
      group: deploy-${{ inputs.service == 'website' && 'thomasriley-blog-w3-pilot' || 'thomasriley-article-w3-pilot' }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate successful component run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.stage_run_id }}
          SERVICE: ${{ inputs.service }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          workflow=.github/workflows/azure-container-webapp.yml
          if [[ "$SERVICE" == article-service ]]; then
            workflow=.github/workflows/azure-container-webapp-article-service.yml
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '{conclusion, head_branch, path, head_sha}' > verified-run.json
          jq -e --arg path "$workflow" \
            '.conclusion == "success" and .head_branch == "main" and .path == $path' verified-run.json
      - uses: actions/download-artifact@v4
        with:
          name: stage-tested-${{ inputs.service }}
          path: stage-verification
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}
      - name: Validate tested digest and component
        env:
          APP: ${{ inputs.service == 'website' && 'thomasriley-blog-w3-pilot' || 'thomasriley-article-w3-pilot' }}
          SERVICE: ${{ inputs.service }}
          DIGEST: ${{ inputs.digest }}
        run: |
          jq -e --arg app "$APP" --arg service "$SERVICE" --arg digest "$DIGEST" \
            --arg revision "$(jq -r .head_sha verified-run.json)" \
            '.app == $app and .service == $service and .digest == $digest and .revision == $revision' \
            stage-verification/verified.json
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: b9ee5d35-c096-4772-8a56-0529054b4dcf
      - name: Promote without swapping settings
        env:
          APP: ${{ inputs.service == 'website' && 'thomasriley-blog-w3-pilot' || 'thomasriley-article-w3-pilot' }}
          DIGEST: ${{ inputs.digest }}
        run: bash scripts/deploy-image.sh "$APP" production "$DIGEST"
